; rx_qsl -- receptor del enlace descendente del MRZN (Raspberry Pi Pico + RF4463PRO)
;
;   pio run -e un_modulo      placa de un modulo (bus SPI0)
;   pio run -e dos_modulos    placa de dos modulos: recibe con el U2 (bus SPI1)
;
; El .uf2 queda en .pio/build/<entorno>/firmware.uf2

[platformio]
default_envs = un_modulo, dos_modulos

[env]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
build_src_flags = -Wshadow

[env:un_modulo]
build_flags = -O2 '-DFW_VERSION="rx_qsl 1.0"'

[env:dos_modulos]
build_flags = -O2 -DDOS_MODULOS=1 '-DFW_VERSION="rx_qsl 1.0"'
